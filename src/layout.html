<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0072F5">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical_url}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical_url}}">
  <meta property="og:image" content="{{og_image}}">
  <meta name="twitter:card" content="{{twitter_card}}">
  <link rel="icon" href="/assets/icons/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <script>(()=>{try{var t=localStorage.getItem('rwz-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/style.css">
  {{json_ld}}
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/assets/brand/logo-transparent.png" alt="">
      <span>Rewiza Tech</span>
    </a>
    <nav class="nav-links" aria-label="Navigasi utama">
      <a href="/"{{nav_home}}>Home</a>
      <a href="/apps/"{{nav_apps}}>Apps</a>
      <a href="/about/"{{nav_about}}>About</a>
      <a href="/privacy-policy/"{{nav_legal}}>Legal</a>
      <a href="/support/"{{nav_support}}>Support</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle type="button">◐ System</button>
      <a class="button" href="/support/">Hubungi Kami ↗</a>
    </div>
  </header>

  <nav class="mobile-nav" aria-label="Navigasi bawah">
    <a href="/"{{nav_home}}>
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
      <span>Home</span>
    </a>
    <a href="/apps/"{{nav_apps}}>
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></span>
      <span>Apps</span>
    </a>
    <a href="/about/"{{nav_about}}>
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></span>
      <span>About</span>
    </a>
    <a href="/privacy-policy/"{{nav_legal}}>
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></span>
      <span>Legal</span>
    </a>
    <a href="/support/"{{nav_support}}>
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg></span>
      <span>Support</span>
    </a>
  </nav>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div>© <span id="year">2026</span> Rewiza Tech. All rights reserved.</div>
    <div class="footer-links">
      <a href="/about/">Tentang</a>
      <a href="/apps/">Aplikasi</a>
      <a href="/faq/">FAQ</a>
      <a href="/privacy-policy/">Privasi</a>
      <a href="/terms/">Ketentuan</a>
      <a href="/support/">Support</a>
    </div>
  </footer>

  <button type="button" class="back-to-top" data-back-to-top aria-label="Kembali ke atas" title="Kembali ke atas">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M12 4l-8 8h5v8h6v-8h5z"/>
    </svg>
  </button>

  <script src="/js/app.js" defer></script>
</body>
</html>
